<svg xmlns="http://www.w3.org/2000/svg" id="print" viewBox="0 0 600 592" role="img" aria-labelledby="t d">
<title id="t">First aid for a burn</title>
<desc id="d">1. Cool the burn under clean running water for 20 minutes; if there is no running water, use a cool drink such as milk or juice; no ice. 2. Take off clothing and jewelry near the burn unless stuck. 3. Cover loosely with plastic wrap (cling film) lengthways or a clean non-stick dressing. 4. Leave blisters alone and put nothing else on. Call your local emergency number for a large or deep burn, or one on the face, mouth, throat or genitals, or from flames, chemicals or electricity.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1a1a1a}.mut{fill:#5e5e5e}.af{fill:#9a6524}.df{fill:#b83b30}.tint{fill:#f6ede2}.dtint{fill:#fbeeec}.ln{stroke:#2b2b2b;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.hair{stroke:#8f8f8f;fill:none;stroke-width:1}.rule{stroke:#d6d6d4;fill:none;stroke-width:1}.acc{stroke:#9a6524;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.dng{stroke:#b83b30;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.hatch{stroke:#b83b30;fill:none;stroke-width:1;opacity:.55}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px}
.h{font-size:18px;font-weight:700}.b{font-weight:700}.s{font-size:13px}.c{font-size:12px;font-weight:700;letter-spacing:.08em}.m{font-family:ui-monospace,Menlo,monospace;font-size:14px}.n{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700}
@media (prefers-color-scheme:dark){.bg{fill:#262626}.ink{fill:#ececec}.mut{fill:#a3a3a3}.af{fill:#d9a066}.df{fill:#ec8277}.tint{fill:#332a21}.dtint{fill:#2f2322}.ln{stroke:#cfcfcf}.hair{stroke:#6f6f6f}.rule{stroke:#3a3a3a}.acc{stroke:#d9a066}.dng{stroke:#ec8277}.hatch{stroke:#ec8277}}
:target .bg{fill:#ffffff}:target .ink{fill:#1a1a1a}:target .mut{fill:#5e5e5e}:target .af{fill:#9a6524}:target .df{fill:#b83b30}:target .tint{fill:#f6ede2}:target .dtint{fill:#fbeeec}:target .ln{stroke:#2b2b2b}:target .hair{stroke:#8f8f8f}:target .rule{stroke:#d6d6d4}:target .acc{stroke:#9a6524}:target .dng{stroke:#b83b30}:target .hatch{stroke:#b83b30}
</style>
<rect class="bg" width="600" height="592" rx="10"/>
<!-- 1. Cool -->
<g transform="translate(16,16)">
<rect class="rule" width="276" height="236" rx="8"/>
<text class="ink h" x="16" y="32"><tspan class="af">1.</tspan> Cool</text>
<path class="rule" d="M16 46 H260"/>
<path class="ln" d="M20 98 H226 Q246 98 246 112 Q246 126 226 126 H20"/>
<path class="dtint" d="M112 98 q26 -10 52 0 z"/><path class="dng" d="M112 98 q26 -10 52 0"/>
<path class="acc" d="M124 56 q5 9 0 14 q-5 -5 0 -14 z M138 62 q5 9 0 14 q-5 -5 0 -14 z M152 56 q5 9 0 14 q-5 -5 0 -14 z"/>
<text class="ink" x="16" y="160">Running water for 20 minutes</text>
<text class="df b" x="16" y="190">No ice</text>
</g>
<!-- 2. Clothing off -->
<g transform="translate(308,16)">
<rect class="rule" width="276" height="236" rx="8"/>
<text class="ink h" x="16" y="32"><tspan class="af">2.</tspan> Clothing off</text>
<path class="rule" d="M16 46 H260"/>
<path class="ln" d="M20 98 H186 Q206 98 206 112 Q206 126 186 126 H20"/>
<path class="dng" d="M90 98 H122"/>
<rect class="tint" x="160" y="92" width="10" height="40" rx="3"/><rect class="acc" x="160" y="92" width="10" height="40" rx="3"/>
<path class="acc" d="M180 76 H236 m-8 -6 l8 6 l-8 6"/>
<text class="ink" x="16" y="160">Take off clothing and jewelry</text>
<text class="ink" x="16" y="180">near the burn, unless stuck</text>
</g>
<!-- 3. Cover -->
<g transform="translate(16,264)">
<rect class="rule" width="276" height="236" rx="8"/>
<text class="ink h" x="16" y="32"><tspan class="af">3.</tspan> Cover</text>
<path class="rule" d="M16 46 H260"/>
<path class="ln" d="M20 98 H226 Q246 98 246 112 Q246 126 226 126 H20"/>
<path class="dng" d="M118 98 H158"/>
<path class="tint" d="M70 92 H206 V98 H70 Z"/><path class="acc" d="M70 92 H206"/>
<path class="hair" d="M70 72 H206 M70 68 V76 M206 68 V76"/>
<text class="ink" x="16" y="160">Loosely: plastic wrap lengthways,</text>
<text class="ink" x="16" y="180">or a clean non-stick dressing</text>
<text class="df b" x="16" y="210">Cover, do not wrap round a limb</text>
</g>
<!-- 4. Leave it -->
<g transform="translate(308,264)">
<rect class="rule" width="276" height="236" rx="8"/>
<text class="ink h" x="16" y="32"><tspan class="af">4.</tspan> Leave it</text>
<path class="rule" d="M16 46 H260"/>
<path class="ln" d="M20 98 H226 Q246 98 246 112 Q246 126 226 126 H20"/>
<path class="dtint" d="M116 98 q22 -26 44 0 z"/><path class="dng" d="M116 98 q22 -26 44 0"/>
<text class="ink" x="16" y="160">Leave blisters alone.</text>
<text class="ink" x="16" y="180">No ice, creams or gels.</text>
</g>
<!-- call the emergency number -->
<path class="dng" style="stroke-width:3" d="M18 516 V572"/>
<text class="ink b" x="32" y="538">Call your local emergency number: large, deep, face, mouth,</text>
<text class="ink b" x="32" y="560">throat, genitals, flames, chemicals, electricity.</text>
</svg>
