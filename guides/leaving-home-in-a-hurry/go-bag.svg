<svg xmlns="http://www.w3.org/2000/svg" id="print" viewBox="0 0 600 330" role="img" aria-labelledby="t d">
<title id="t">The go-bag</title>
<desc id="d">What to keep in a bag ready to carry on foot: ID and document copies, medicines and special food, water and food, phone with charger and power bank, cash, radio and flashlight with batteries, change of clothes and sturdy shoes, contact list, pet supplies.</desc>
<style>
.bg{fill:#ffffff}.ink{fill:#1a1a1a}.mut{fill:#5e5e5e}.af{fill:#9a6524}.df{fill:#b83b30}.tint{fill:#f6ede2}.dtint{fill:#fbeeec}.ln{stroke:#2b2b2b;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.hair{stroke:#8f8f8f;fill:none;stroke-width:1}.rule{stroke:#d6d6d4;fill:none;stroke-width:1}.acc{stroke:#9a6524;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.dng{stroke:#b83b30;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.hatch{stroke:#b83b30;fill:none;stroke-width:1;opacity:.55}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px}
.h{font-size:18px;font-weight:700}.b{font-weight:700}.s{font-size:13px}.c{font-size:12px;font-weight:700;letter-spacing:.08em}.m{font-family:ui-monospace,Menlo,monospace;font-size:14px}.n{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700}
@media (prefers-color-scheme:dark){.bg{fill:#262626}.ink{fill:#ececec}.mut{fill:#a3a3a3}.af{fill:#d9a066}.df{fill:#ec8277}.tint{fill:#332a21}.dtint{fill:#2f2322}.ln{stroke:#cfcfcf}.hair{stroke:#6f6f6f}.rule{stroke:#3a3a3a}.acc{stroke:#d9a066}.dng{stroke:#ec8277}.hatch{stroke:#ec8277}}
:target .bg{fill:#ffffff}:target .ink{fill:#1a1a1a}:target .mut{fill:#5e5e5e}:target .af{fill:#9a6524}:target .df{fill:#b83b30}:target .tint{fill:#f6ede2}:target .dtint{fill:#fbeeec}:target .ln{stroke:#2b2b2b}:target .hair{stroke:#8f8f8f}:target .rule{stroke:#d6d6d4}:target .acc{stroke:#9a6524}:target .dng{stroke:#b83b30}:target .hatch{stroke:#b83b30}
</style>
<rect class="bg" width="600" height="330" rx="10"/>
<text class="ink h" x="24" y="34">The go-bag: carry it on foot</text>
<path class="rule" d="M24 48 H576"/>
<!-- the bag, outline only -->
<path class="ln" d="M84 92 v-6 q20 -18 40 0 v6"/>
<path class="ln" d="M44 140 q-16 70 -4 156 M164 140 q16 70 4 156"/>
<path class="acc" d="M44 304 V138 Q44 92 104 92 Q164 92 164 138 V304 Q164 312 156 312 H52 Q44 312 44 304 Z"/>
<path class="ln" d="M44 150 Q104 172 164 150"/>
<path class="hair" stroke-dasharray="3 4" d="M56 136 Q104 152 152 136"/>
<rect class="ln" x="62" y="208" width="84" height="88" rx="10"/>
<path class="ln" d="M62 230 H146"/>
<rect class="tint" x="98" y="224" width="12" height="12" rx="2"/><rect class="acc" x="98" y="224" width="12" height="12" rx="2"/>
<path class="hair" d="M78 248 v32 M130 248 v32"/>
<!-- the list -->
<g class="list">
<rect class="acc" x="204" y="83" width="7" height="7" rx="1"/><text class="ink" x="226" y="92">ID cards, passports, document copies</text>
<path class="rule" d="M204 103 H576"/>
<rect class="acc" x="204" y="115" width="7" height="7" rx="1"/><text class="ink" x="226" y="124">Medicines and special food</text>
<path class="rule" d="M204 135 H576"/>
<rect class="acc" x="204" y="147" width="7" height="7" rx="1"/><text class="ink" x="226" y="156">Water and food for the journey</text>
<path class="rule" d="M204 167 H576"/>
<rect class="acc" x="204" y="179" width="7" height="7" rx="1"/><text class="ink" x="226" y="188">Phone, charger, power bank</text>
<path class="rule" d="M204 199 H576"/>
<rect class="acc" x="204" y="211" width="7" height="7" rx="1"/><text class="ink" x="226" y="220">Cash; contact list</text>
<path class="rule" d="M204 231 H576"/>
<rect class="acc" x="204" y="243" width="7" height="7" rx="1"/><text class="ink" x="226" y="252">Radio, flashlight, spare batteries</text>
<path class="rule" d="M204 263 H576"/>
<rect class="acc" x="204" y="275" width="7" height="7" rx="1"/><text class="ink" x="226" y="284">Change of clothes, sturdy shoes; pet supplies</text>
</g>
</svg>
